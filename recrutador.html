<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LinkedOut — Recrutador</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link rel="stylesheet" href="style.css"></head><body><header><div class="nav-container"><div class="brand-section"><a href="index.html" class="logo">LinkedOut</a><span class="role-badge recrutador" id="badge">Recrutador</span></div><div class="nav-user"><span id="who"></span><button class="btn-nav" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i></button></div></div></header><main><div style="display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:1rem"><button class="pill-btn active" id="tab-jobs" onclick="showTab('jobs')">Vagas e candidaturas</button><button class="pill-btn" id="tab-blacklist" onclick="showTab('blacklist')">Lista de bloqueio</button><button class="pill-btn" id="btn-clear-all" hidden style="color:#b00020;margin-left:auto" onclick="clearAll()"><i class="fa-solid fa-broom"></i> Limpar todas as candidaturas</button></div><section id="jobs-tab"><div class="linkedin-grid"><section class="jobs-sidebar"><div class="sidebar-header" style="display:flex;justify-content:space-between;align-items:center"><h3>Vagas anunciadas</h3><button class="pill-btn active" onclick="newJob()">+ Nova vaga</button></div><div class="jobs-list" id="jobs"></div></section><section class="detail-island" id="detail">Carregando...</section></div></section><section id="blacklist-tab" hidden class="detail-island"><h3>Bloquear nome completo</h3><p>Quem estiver nesta lista não poderá entrar como candidato.</p><form onsubmit="addBlocked(event)" style="display:flex;gap:.5rem;margin:1rem 0;flex-wrap:wrap"><input id="blocked-name" class="form-control" style="flex:1;min-width:200px" placeholder="Nome completo" required><button class="btn-primary" style="width:auto">Adicionar</button></form><div id="blocked-list"></div></section></main><div id="modal" style="display:none;position:fixed;inset:0;background:#0008;z-index:1000;align-items:center;justify-content:center;padding:1rem"><form onsubmit="saveJob(event)" style="background:white;padding:1.5rem;border-radius:10px;width:min(520px,100%);max-height:90vh;overflow:auto"><h3 id="modal-title">Nova vaga</h3><input type="hidden" id="job-id"><div class="form-group"><label>Título</label><input id="title" class="form-control" required></div><div class="form-group"><label>Empresa</label><input id="company" class="form-control" required></div><div class="form-group"><label>Área</label><input id="category" class="form-control" required placeholder="TI, Educação, Meio Ambiente..."></div><div class="form-group"><label>Localização</label><input id="location" class="form-control" required></div><div class="form-group"><label>Descrição</label><textarea id="description" class="form-control" rows="5" required></textarea></div><div style="display:flex;gap:.5rem;justify-content:flex-end"><button type="button" class="pill-btn" onclick="closeModal()">Cancelar</button><button class="btn-primary" style="width:auto">Salvar vaga</button></div></form></div><script src="config.js"></script><script src="sync.js"></script><script>
const isMaster=()=>!!user&&user.role==='master';let user=null,jobs=[],apps=[],selected=null;
async function init(){try{const d=await loadData();user=d.user;if(!user||(user.role!=='recrutador'&&user.role!=='master')){location.href='index.html';return}document.getElementById('who').textContent=user.name;if(user.role==='master'){document.getElementById('badge').textContent='Master';document.getElementById('btn-clear-all').hidden=false}refresh(d);setInterval(async()=>{try{refresh(await loadData())}catch(e){}},5000)}catch(e){if(e.status===401){location.href='index.html';return}setTimeout(init,3000)}}
let _last='';function refresh(d){const sig=JSON.stringify([d.jobs,d.applications]);if(sig===_last)return;_last=sig;jobs=d.jobs;apps=d.applications;if(!selected||!jobs.some(j=>j.id===selected))selected=jobs[0]?.id;render()}
function render(){document.getElementById('jobs').innerHTML=jobs.map(j=>`<div class="job-card-item ${j.id===selected?'selected':''}" onclick="selectJob('${esc(j.id)}')"><b>${esc(j.title)}</b><div>${esc(j.company)}</div><small>${apps.filter(a=>a.jobId===j.id).length} candidatura(s)</small></div>`).join('')||'<p class="empty-state">Nenhuma vaga cadastrada.</p>';renderDetail()}
function selectJob(id){selected=id;render()}
function renderDetail(){const j=jobs.find(x=>x.id===selected),box=document.getElementById('detail');if(!j){box.textContent='Cadastre uma vaga para começar.';return}const ja=apps.filter(a=>a.jobId===j.id);box.innerHTML=`<div class="detail-header"><div class="detail-title">${esc(j.title)}</div><div class="detail-company">${esc(j.company)}</div><p>${esc(j.location)} · ${esc(j.category)}</p><p class="detail-body">${esc(j.description).replace(/\n/g,"<br>")}</p><button class="pill-btn" onclick="editJob('${esc(j.id)}')">Editar descrição / vaga</button>${isMaster()?`<button class="pill-btn" style="margin-left:.4rem;color:#b00020" onclick="delJob('${esc(j.id)}')">Apagar vaga</button><button class="pill-btn" style="margin-left:.4rem;color:#b00020" onclick="clearJobApps('${esc(j.id)}')">Limpar candidaturas da vaga</button>`:''}</div><h3>Candidaturas (${ja.length})</h3>${ja.map(a=>`<div class="applicant-item"><div class="applicant-head"><b>${esc(a.candidateName)}</b><span class="status-badge status-${esc(a.status)}">${esc(a.status)}</span></div><p>${esc(a.note)}</p><small>Enviada: ${esc(a.appliedAt)}</small>${a.resumePath?`<p><a href="#" data-resume="${esc(a.id)}">Abrir currículo</a></p>`:''}${a.status==='Pendente'?`<div class="action-row"><button class="btn-sm-success" onclick="setStatus('${esc(a.id)}','Aceito')">Aceitar / entrevistar</button><button class="btn-sm-danger" onclick="setStatus('${esc(a.id)}','Rejeitado')">Rejeitar</button></div>`:''}${isMaster()?`<div class="action-row"><button class="btn-sm-danger" onclick="delApp('${esc(a.id)}')">Apagar candidatura</button></div>`:''}</div>`).join('')||'<p class="empty-state">Aguardando candidaturas.</p>'}`}
async function setStatus(id,status){try{await api('status',{id,status});refresh(await loadData())}catch(e){alert(e.message)}}
function newJob(){document.getElementById('modal-title').textContent='Nova vaga';document.getElementById('job-id').value='';['title','company','category','location','description'].forEach(x=>document.getElementById(x).value='');document.getElementById('modal').style.display='flex'}
function editJob(id){const j=jobs.find(x=>x.id===id);if(!j)return;document.getElementById('modal-title').textContent='Editar vaga';document.getElementById('job-id').value=j.id;['title','company','category','location','description'].forEach(x=>document.getElementById(x).value=j[x]);document.getElementById('modal').style.display='flex'}
function closeModal(){document.getElementById('modal').style.display='none'}
async function saveJob(e){e.preventDefault();const id=document.getElementById('job-id').value,d={id};['title','company','category','location','description'].forEach(x=>d[x]=document.getElementById(x).value);try{await api(id?'edit_job':'create_job',d);closeModal();refresh(await loadData())}catch(e){alert(e.message)}}
function showTab(t){document.getElementById('jobs-tab').hidden=t!=='jobs';document.getElementById('blacklist-tab').hidden=t!=='blacklist';document.getElementById('tab-jobs').classList.toggle('active',t==='jobs');document.getElementById('tab-blacklist').classList.toggle('active',t==='blacklist');if(t==='blacklist')loadBlacklist()}
async function loadBlacklist(){try{const d=await api('blacklist_list',{},'GET');document.getElementById('blocked-list').innerHTML=d.names.map(n=>`<div class="applicant-item" style="display:flex;justify-content:space-between;align-items:center"><span>${esc(n)}</span><button class="btn-sm-danger" onclick="removeBlocked('${esc(n).replace(/'/g,"&#39;")}')">Remover</button></div>`).join('')||'<p>Nenhum nome bloqueado.</p>'}catch(e){alert(e.message)}}
async function addBlocked(e){e.preventDefault();try{await api('blacklist_add',{name:document.getElementById('blocked-name').value});document.getElementById('blocked-name').value='';loadBlacklist()}catch(e){alert(e.message)}}
async function removeBlocked(name){try{await api('blacklist_remove',{name});loadBlacklist()}catch(e){alert(e.message)}}
async function masterDo(action,data,msg){if(!confirm(msg))return;try{await api(action,data);refresh(await loadData())}catch(e){alert(e.message)}}
function delJob(id){const j=jobs.find(x=>x.id===id);masterDo('delete_job',{id},'Apagar a vaga "'+(j?j.title:'')+'" e todas as candidaturas dela? Isso não pode ser desfeito.')}
function clearJobApps(id){masterDo('clear_job_applications',{id},'Apagar todas as candidaturas desta vaga?')}
function delApp(id){masterDo('delete_application',{id},'Apagar esta candidatura?')}
function clearAll(){masterDo('clear_applications',{},'Apagar TODAS as candidaturas de TODAS as vagas (e os currículos)? Isso não pode ser desfeito.')}
init();
</script></body></html>
