<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LinkedOut — Entrada</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link rel="stylesheet" href="style.css"></head><body><header><div class="nav-container"><a class="logo" href="index.html"><i class="fa-brands fa-linkedin"></i> LinkedOut</a><span>Plataforma de Oportunidades Acadêmicas</span></div></header><main><section class="portal-card"><h1><i class="fa-brands fa-linkedin"></i> LinkedOut</h1><p>Entre como candidato ou recrutador.</p><div class="form-group"><label>Tipo de acesso</label><select id="role" class="form-control" onchange="switchRole()"><option value="candidato">Candidato</option><option value="recrutador">Recrutador / Avaliador</option><option value="master">Master (administrador)</option></select></div><form id="login" onsubmit="login(event)"><div class="form-group" id="name-wrap"><label>Nome completo</label><input id="name" class="form-control" autocomplete="name" required></div><div class="form-group" id="password-wrap" hidden><label>Senha</label><input id="password" class="form-control" type="password" autocomplete="current-password"></div><button class="btn-primary">Entrar no portal <i class="fa-solid fa-arrow-right"></i></button><button type="button" class="pill-btn" style="margin-top:1rem" onclick="document.getElementById('role').value='master';switchRole();document.getElementById('password').focus()"><i class="fa-solid fa-user-shield"></i> Acesso Master</button><p id="mode" style="font-size:.8rem;color:#666;margin-top:1rem"></p><p id="error" style="color:#b00020;margin-top:1rem"></p></form></section></main><script src="config.js"></script><script src="sync.js"></script><script>if(!CFG.firebaseUrl)document.getElementById('mode').textContent='Modo local: os dados ficam salvos apenas neste navegador.';function switchRole(){const r=document.getElementById('role').value;document.getElementById('password-wrap').hidden=r==='candidato';document.getElementById('password').required=r!=='candidato';document.getElementById('name-wrap').hidden=r==='master';document.getElementById('name').required=r!=='master';}async function login(e){e.preventDefault();const role=document.getElementById('role').value;try{const d=await api(role==='candidato'?'candidate_login':role==='master'?'master_login':'recruiter_login',{name:role==='master'?'master':document.getElementById('name').value,password:document.getElementById('password').value});location.href=role==='candidato'?'candidato.html':'recrutador.html';}catch(err){document.getElementById('error').textContent=err.message;}}</script></body></html>
