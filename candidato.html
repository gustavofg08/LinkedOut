<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LinkedOut — Candidato</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link rel="stylesheet" href="style.css"></head><body><header><div class="nav-container"><div class="brand-section"><a href="index.html" class="logo">LinkedOut</a><span class="role-badge candidato">Candidato</span></div><div class="nav-user"><span id="who"></span><button class="btn-nav" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i></button></div></div></header><main><div class="linkedin-grid"><section class="jobs-sidebar"><div class="sidebar-header"><h3>Vagas disponíveis</h3><div class="filter-pills"><button class="pill-btn active" onclick="filterJobs('TODOS',this)">Todas</button><button class="pill-btn" onclick="filterJobs('TI',this)">TI</button><button class="pill-btn" onclick="filterJobs('ADM',this)">Administração</button><button class="pill-btn" onclick="filterJobs('Educação',this)">Educação</button><button class="pill-btn" onclick="filterJobs('Meio Ambiente',this)">Meio ambiente</button><button class="pill-btn" onclick="filterJobs('Projetos',this)">Projetos</button></div></div><div class="jobs-list" id="jobs"></div></section><section class="detail-island" id="detail">Carregando vagas...</section></div></main><script src="config.js"></script><script src="sync.js"></script><script>
let user=null,jobs=[],apps=[],selected=null,filter='TODOS';
async function init(){try{const d=await loadData();user=d.user;if(!user||user.role!=='candidato'){location.href='index.html';return}document.getElementById('who').textContent=user.name;refresh(d);setInterval(async()=>{try{refresh(await loadData())}catch(e){}},5000)}catch(e){if(e.status===401){location.href='index.html';return}document.getElementById('detail').textContent='Carregando vagas...';setTimeout(init,3000)}}
let _last='';function refresh(d){const sig=JSON.stringify([d.jobs,d.applications]);if(sig===_last)return;_last=sig;jobs=d.jobs;apps=d.applications;if(!selected||!jobs.some(j=>j.id===selected))selected=jobs[0]?.id;render()}
function filterJobs(v,b){filter=v;document.querySelectorAll('.pill-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()}
function render(){const list=jobs.filter(j=>filter==='TODOS'||j.category===filter);document.getElementById('jobs').innerHTML=list.map(j=>`<div class="job-card-item ${j.id===selected?'selected':''}" onclick="selectJob('${esc(j.id)}')"><div class="job-card-title">${esc(j.title)}</div><div class="job-card-company">${esc(j.company)}</div><div class="job-card-meta">${esc(j.location)} · ${esc(j.category)}</div></div>`).join('')||'<p class="empty-state">Nenhuma vaga nesta categoria.</p>';renderDetail()}
function selectJob(id){selected=id;render()}
function renderDetail(){const j=jobs.find(x=>x.id===selected),box=document.getElementById('detail');if(!j){box.textContent='Nenhuma vaga disponível.';return}const a=apps.find(x=>x.jobId===j.id&&x.candidateName.toLowerCase()===user.name.toLowerCase());box.innerHTML=`<div class="detail-header"><div class="detail-title">${esc(j.title)}</div><div class="detail-company">${esc(j.company)}</div><div class="detail-meta-pills"><span class="meta-badge">${esc(j.location)}</span><span class="meta-badge">${esc(j.category)}</span></div></div><div class="detail-body"><h4>Descrição da oportunidade</h4><p>${esc(j.description).replace(/\n/g,'<br>')}</p></div>${a?`<div class="applicant-item"><b>Status da candidatura: </b><span class="status-badge status-${esc(a.status)}">${esc(a.status)}</span><p>Apresentação: ${esc(a.note)}</p>${a.resumePath?`<a href="#" data-resume="${esc(a.id)}">Currículo enviado</a>`:''}</div>`:`<h4>Candidatar-se</h4><form onsubmit="apply(event,'${esc(j.id)}')"><div class="form-group"><label>Apresentação curta</label><textarea class="form-control" id="note" rows="4" required placeholder="Conte um pouco sobre você e seu interesse na vaga."></textarea></div><div class="form-group"><label>Currículo (opcional — PDF, DOC ou DOCX, até 2 MB)</label><input class="form-control" id="resume" type="file" accept=".pdf,.doc,.docx"></div><button class="btn-primary">Enviar candidatura</button></form>`}`}
async function apply(e,id){e.preventDefault();try{const f=document.getElementById('resume').files[0];const url=f?await readResume(f):null;const d=await api('apply',{jobId:id,note:document.getElementById('note').value});if(f){await api('resume',{applicationId:d.id,fileName:f.name,dataUrl:url})}refresh(await loadData());alert('Candidatura enviada!')}catch(err){alert(err.message)}}
init();
</script></body></html>
